# PulseSSH detekt configuration.
#
# Layered on top of detekt's defaults (buildUponDefaultConfig = true in
# app/build.gradle.kts), so only deviations are listed here. Two goals:
#   * fail the build on any real issue (build.maxIssues = 0);
#   * never fight Jetpack Compose conventions - PascalCase @Composable functions,
#     dp/sp literals in previews, and long declarative layout functions are idiomatic,
#     not smells.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  # The `formatting` ruleset lives in the optional detekt-formatting artifact, which is
  # not on the classpath today (ktlint covers formatting). Excluding it from config
  # validation keeps the section below inert instead of failing the run.
  excludes: '^formatting.*'

processors:
  active: true

console-reports:
  active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ['androidx.compose.runtime.Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    thresholdInEnums: 20
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
  LargeClass:
    active: true
    threshold: 600
  NestedBlockDepth:
    active: true
    threshold: 5

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowsCount:
    active: true
    max: 3

naming:
  active: true
  FunctionNaming:
    active: true
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['androidx.compose.runtime.Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
    privateConstantPattern: '[A-Za-z][_A-Za-z0-9]*'
  MatchingDeclarationName:
    active: true
  ConstructorParameterNaming:
    active: true

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

style:
  active: true
  MagicNumber:
    active: true
    # Layout constants inside previews, and fixtures inside tests, are not magic.
    excludes: ['**/test/**', '**/androidTest/**', '**/*Preview*.kt', '**/*Test.kt']
    ignoreAnnotated:
      - 'androidx.compose.ui.tooling.preview.Preview'
      - 'androidx.compose.ui.tooling.preview.PreviewParameter'
      - 'androidx.compose.runtime.Composable'
    ignoreNumbers: ['-1', '0', '1', '2', '100', '1000']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  UnusedPrivateProperty:
    active: true
    ignoreAnnotated: ['androidx.compose.ui.tooling.preview.Preview']
  UnusedPrivateFunction:
    active: true
    ignoreAnnotated: ['androidx.compose.ui.tooling.preview.Preview']
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Unfinished work must be tracked in an issue, not left in the source.'
        value: 'FIXME:'
      - reason: 'Do not ship stubbed-out behaviour.'
        value: 'STOPSHIP:'
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.material3.*'
      - 'androidx.compose.runtime.*'
  UnnecessaryAbstractClass:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true

# Formatting basics. These rules only run when the detekt-formatting artifact is added
# as a detektPlugins dependency; until then ktlint (see .editorconfig) enforces them and
# this section is excluded from config validation above.
formatting:
  active: true
  android: true
  autoCorrect: false
  ChainWrapping:
    active: true
  CommentSpacing:
    active: true
  Filename:
    active: true
  FinalNewline:
    active: true
  ImportOrdering:
    active: true
  Indentation:
    active: true
    indentSize: 4
  MaximumLineLength:
    active: true
    maxLineLength: 120
  NoBlankLineBeforeRbrace:
    active: true
  NoConsecutiveBlankLines:
    active: true
  NoEmptyClassBody:
    active: true
  NoMultipleSpaces:
    active: true
  NoSemicolons:
    active: true
  NoTrailingSpaces:
    active: true
  NoUnusedImports:
    active: true
  NoWildcardImports:
    active: false
  SpacingAroundColon:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundCurly:
    active: true
  SpacingAroundKeyword:
    active: true
  SpacingAroundOperators:
    active: true
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  FunctionName:
    active: false
