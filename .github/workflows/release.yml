# ===========================================================================
# PulseSSH - production release.
#
#  READ THIS BEFORE CHANGING ANYTHING
#
#  1. Merging to main NEVER releases anything. main only runs CI.
#     A release happens for exactly one reason: an annotated version tag
#     matching v*.*.* is pushed (or this workflow is dispatched with a tag).
#
#  2. The "release" job targets the GitHub Environment named "production".
#     That Environment is where the required reviewer lives, so every release
#     pauses for a human approval before the signing key is ever decoded.
#
#  3. THE UPLOAD KEYSTORE SECRET (PULSESSH_KEYSTORE_BASE64) MUST NEVER BE
#     REGENERATED OR REPLACED. Android identifies an app update by its signing
#     key. A new keystore produces a package that existing users cannot install
#     over their current one - they would have to uninstall and lose all local
#     data (hosts, keys, known_hosts). If the keystore is ever lost, that is an
#     incident, not a routine rotation. Keep an offline backup.
# ===========================================================================
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, e.g. v1.4.0"
        required: true
        type: string

# One release per tag, and never cancel a release that is already in flight.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Xmx1g
    -Dorg.gradle.jvmargs=-Xmx2560m
    -Dorg.gradle.workers.max=2
    -Dkotlin.daemon.jvm.options=-Xmx1536m
    -Dfile.encoding=UTF-8

jobs:
  # Same gates as CI, run against the tagged commit. No artifacts: this job
  # exists purely to refuse to release a broken tag.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-verify-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Manual approval gate: configure a required reviewer on this Environment.
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Decoded OUTSIDE the workspace (runner.temp) so it can never be picked
      # up by a Gradle copy task, an artifact upload glob, or a stray git add.
      - name: Decode upload keystore
        env:
          PULSESSH_KEYSTORE_BASE64: ${{ secrets.PULSESSH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PULSESSH_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret PULSESSH_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/pulsessh-upload.jks"
          printf '%s' "${PULSESSH_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "PULSESSH_KEYSTORE_PATH=${keystore_path}" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          # Consumed by the release signingConfig in app/build.gradle.kts, which
          # only signs when ALL FOUR are present and otherwise builds unsigned.
          # So a missing secret must be a hard error here, not a silent unsigned
          # artifact attached to a public release.
          PULSESSH_KEYSTORE_PASSWORD: ${{ secrets.PULSESSH_KEYSTORE_PASSWORD }}
          PULSESSH_KEY_ALIAS: ${{ secrets.PULSESSH_KEY_ALIAS }}
          PULSESSH_KEY_PASSWORD: ${{ secrets.PULSESSH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PULSESSH_KEYSTORE_PATH PULSESSH_KEYSTORE_PASSWORD \
                      PULSESSH_KEY_ALIAS PULSESSH_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty; the release would be unsigned."
              exit 1
            fi
          done
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Assert the APK is signed
        run: |
          set -euo pipefail
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::An unsigned APK was produced. Check the signing secrets."
            exit 1
          fi
          ls -l app/build/outputs/apk/release app/build/outputs/bundle/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: PulseSSH ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Runs even if the build or the upload failed, and even on cancellation.
      - name: Shred decoded keystore
        if: always()
        run: |
          keystore_path="${RUNNER_TEMP}/pulsessh-upload.jks"
          if [ -f "${keystore_path}" ]; then
            shred -u "${keystore_path}" 2>/dev/null || rm -f "${keystore_path}"
          fi
          echo "Keystore removed: $([ -f "${keystore_path}" ] && echo NO || echo yes)"
